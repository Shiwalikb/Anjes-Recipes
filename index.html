<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffc4dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anje's Recipes">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B0%3C/text%3E%3C/svg%3E">
</head>
<body>
<title>Anje's Recipes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@600;700&family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* Layout: a pink gingham tablecloth; each recipe is a taped journal page with its own little animated mascot */
:root{
  --bg:#fff4f7; --check:rgba(255,150,185,.15); --paper:#fffdfa; --paper-2:#fff6f9;
  --ink:#4b3242; --ink-soft:#8a687c; --rule:#f3d8e3; --pink:#ff8fb6; --pink-strong:#cf3f78;
  --mint:#9fe3cf; --lav:#d8c7ff; --butter:#ffe8a0; --peach:#ffcaa9;
  --hl:#ffe27a; --note:#fff3b8; --note-ink:#5b4630;
  --shadow:0 14px 30px -16px rgba(190,80,125,.5); --scrim:rgba(75,50,66,.45);
  --font-script:'Pacifico','Dancing Script','Snell Roundhand',cursive;
  --font-flow:'Dancing Script','Snell Roundhand',cursive;
  --font-hand:'Caveat','Bradley Hand','Comic Sans MS',cursive;
  --font-ui:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;
  --lift:0%;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1420; --check:rgba(255,140,190,.055); --paper:#2a1f2d; --paper-2:#322437;
  --ink:#f8e8f0; --ink-soft:#c7a8b9; --rule:#3f2e40; --pink:#ff9fc4; --pink-strong:#ff8bbb;
  --mint:#6fbfa8; --lav:#a690e3; --butter:#d6ba5e; --peach:#df9f80;
  --hl:rgba(255,200,90,.34); --note:#4a3d26; --note-ink:#f5e6c4;
  --shadow:0 16px 34px -16px rgba(0,0,0,.75); --scrim:rgba(10,5,12,.65); --lift:55%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1c1420; --check:rgba(255,140,190,.055); --paper:#2a1f2d; --paper-2:#322437;
  --ink:#f8e8f0; --ink-soft:#c7a8b9; --rule:#3f2e40; --pink:#ff9fc4; --pink-strong:#ff8bbb;
  --mint:#6fbfa8; --lav:#a690e3; --butter:#d6ba5e; --peach:#df9f80;
  --hl:rgba(255,200,90,.34); --note:#4a3d26; --note-ink:#f5e6c4;
  --shadow:0 16px 34px -16px rgba(0,0,0,.75); --scrim:rgba(10,5,12,.65); --lift:55%; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  font-family:var(--font-ui); font-size:16px; line-height:1.55; color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(90deg,var(--check) 50%,transparent 50%),linear-gradient(var(--check) 50%,transparent 50%);
  background-size:38px 38px; min-height:100vh;
  transition:background-color .3s,color .3s;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink-strong);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px dashed var(--rule)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex:0 0 auto}
.brand-art{width:46px;height:46px}
.brand-name{font-family:var(--font-script);font-size:1.7rem;line-height:1.1;color:var(--pink-strong);text-shadow:2px 2px 0 var(--hl);white-space:nowrap}
.search{position:relative;flex:1 1 260px;min-width:0;order:3}
@media (min-width:760px){.search{order:0}}
.search input{width:100%;padding:11px 16px 11px 42px;border-radius:999px;border:2px solid var(--rule);background:var(--paper);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--pink);box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 25%,transparent)}
.search svg.icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-soft);pointer-events:none}
.top-actions{display:flex;gap:8px;margin-left:auto;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none;font-size:.95rem;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--pink-strong);color:#fff;box-shadow:0 6px 0 -1px color-mix(in srgb,var(--pink-strong) 55%,#000 10%)}
:root[data-theme="dark"] .btn-primary{color:#2a1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#2a1020}}
.btn-soft{background:var(--paper);border:2px solid var(--rule)}
.btn-soft:hover{border-color:var(--pink)}
.btn-danger{background:transparent;border:2px solid color-mix(in srgb,#e0526e 60%,var(--rule));color:#d9435f}
.btn-danger.solid{background:#d9435f;color:#fff;border-color:#d9435f}
@media (max-width:520px){.brand-name{font-size:1.3rem}.brand-art{width:38px;height:38px}#add-btn span{display:none}#add-btn{padding:10px 12px}.topbar .wrap{gap:10px}}
.icon-btn{width:44px;height:44px;padding:0;border-radius:50%;background:var(--paper);border:2px solid var(--rule)}
.icon-btn svg{width:20px;height:20px}
.btn svg{width:18px;height:18px;flex:0 0 auto}

/* search results dropdown */
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--paper);border:2px solid var(--rule);border-radius:20px;box-shadow:var(--shadow);padding:8px;max-height:min(70vh,520px);overflow:auto;z-index:25}
.result{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:14px;text-decoration:none;cursor:pointer}
.result:hover,.result.active{background:var(--paper-2)}
.result .mini{width:52px;height:52px;flex:0 0 auto;background:color-mix(in srgb,var(--accent) 22%,var(--paper));border-radius:14px;padding:3px}
.result-title{font-family:var(--font-script);font-size:1.15rem;line-height:1.3;color:var(--ink)}
.result-snip{font-size:.85rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-body{min-width:0;flex:1}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 2px}
.results-empty{padding:14px;color:var(--ink-soft);text-align:center;font-family:var(--font-hand);font-size:1.3rem}

/* ---------- home ---------- */
.hero{padding-block:30px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hello{font-family:var(--font-flow);font-size:clamp(1.6rem,4vw,2.4rem);margin:0;line-height:1.15;text-wrap:balance}
.hello b{color:var(--pink-strong);font-weight:700}
.count{margin:4px 0 0;color:var(--ink-soft);font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--rule);background:var(--paper);padding:6px 14px;border-radius:999px;font-weight:600;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#3a1326}
.filters{padding-block:12px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 24px;padding-block:22px 40px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:26px 20px 18px;text-decoration:none;
  background:var(--paper);background-image:repeating-linear-gradient(transparent 0 29px,var(--rule) 29px 30px);background-position:0 12px;
  border-radius:4px 4px 16px 16px;box-shadow:var(--shadow);transform:rotate(var(--tilt,0deg));transition:transform .25s,box-shadow .25s;min-width:0}
.card:hover,.card:focus-visible{transform:rotate(0) translateY(-6px);box-shadow:0 22px 40px -18px color-mix(in srgb,var(--accent) 70%,transparent)}
.card:hover .card-art .mascot{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-10px) rotate(-4deg)}60%{transform:translateY(0) rotate(2deg)}}
.card-art{height:118px;display:flex;justify-content:center;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 28%,transparent),transparent)}
.card-art .mascot{width:118px;height:118px}
.card-title{font-family:var(--font-script);font-weight:400;font-size:1.45rem;line-height:1.35;margin:4px 0 0;text-wrap:balance;text-shadow:2px 2px 0 color-mix(in srgb,var(--hl) 85%,transparent)}
.card-meta{margin:0;font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.card-peek{list-style:none;margin:2px 0 0;padding:0;font-family:var(--font-hand);font-size:1.25rem;line-height:1.25;color:var(--ink-soft)}
.card-peek li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-peek li::before{content:"♡ ";color:var(--pink)}
.card-heart{position:absolute;right:14px;top:12px;color:var(--pink-strong);font-size:1.3rem}
.card-photo{position:absolute;right:-10px;bottom:-12px;width:62px;height:72px;background:#fff;padding:4px 4px 12px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4);transform:rotate(7deg);border-radius:2px}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block}
.tape{position:absolute;width:92px;height:24px;top:-11px;left:50%;margin-left:-46px;transform:rotate(-3deg);opacity:.9;
  background-color:color-mix(in srgb,var(--wash) 55%,transparent);
  background-image:linear-gradient(90deg,color-mix(in srgb,var(--wash) 80%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--wash) 80%,transparent) 50%,transparent 50%);
  background-size:10px 10px;clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,4% 96%,0 50%)}
.empty{text-align:center;padding:40px 16px 70px;max-width:460px;margin:0 auto}
.empty .mascot{width:150px;height:150px}
.empty h2{font-family:var(--font-script);font-weight:400;font-size:1.8rem;margin:8px 0}
.empty p{color:var(--ink-soft)}

/* ---------- recipe page ---------- */
.back{display:inline-flex;align-items:center;gap:6px;margin-block:22px 14px;font-weight:700;text-decoration:none;color:var(--ink-soft)}
.back:hover{color:var(--pink-strong)}
.page{position:relative;background:var(--paper);border-radius:6px 6px 22px 22px;box-shadow:var(--shadow);padding:44px clamp(18px,4vw,52px) 40px;margin-bottom:48px;
  border:10px solid transparent;
  background-image:linear-gradient(var(--paper),var(--paper)),
    linear-gradient(90deg,color-mix(in srgb,var(--wash) 45%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--wash) 45%,transparent) 50%,transparent 50%);
  background-origin:padding-box,border-box,border-box;background-clip:padding-box,border-box,border-box;background-size:auto,14px 14px,14px 14px}
.page .tape.tl{left:-14px;top:-8px;margin:0;transform:rotate(-32deg)}
.page .tape.tr{left:auto;right:-14px;top:-8px;margin:0;transform:rotate(30deg)}
.r-head{display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:center}
.r-eyebrow{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--accent-ink,var(--pink-strong)),#fff var(--lift))}
.r-title{font-family:var(--font-script);font-weight:400;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.25;margin:4px 0 10px;color:color-mix(in srgb,var(--accent-ink,var(--pink-strong)),#fff var(--lift));text-shadow:3px 3px 0 var(--hl);text-wrap:balance;overflow-wrap:anywhere}
.r-mascot{width:clamp(120px,22vw,190px);height:clamp(120px,22vw,190px);background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),transparent)}
.r-mascot .mascot{width:100%;height:100%}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{background:var(--paper-2);border:2px dashed var(--rule);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.9rem}
.r-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-bottom:22px;border-bottom:2px dashed var(--rule)}
.fav[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#3a1326}
.r-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px;margin-top:26px}
@media (max-width:760px){.r-body{grid-template-columns:1fr}.r-head{grid-template-columns:1fr}.r-mascot{order:-1;margin:0 auto}}
.hand-h{font-family:var(--font-flow);font-size:2rem;margin:0 0 8px;color:var(--ink)}
.hand-h::after{content:"";display:block;width:70px;height:6px;border-radius:6px;background:var(--accent);opacity:.55;margin-top:2px}
.sec-name{font-family:var(--font-hand);font-weight:700;font-size:1.45rem;margin:16px 0 4px;color:color-mix(in srgb,var(--accent-ink,var(--pink-strong)),#fff var(--lift))}
.ing-list{list-style:none;margin:0;padding:0}
.ing-list li{border-bottom:1px solid var(--rule)}
.ing-list label{display:flex;gap:10px;align-items:flex-start;padding:5px 2px;cursor:pointer;font-family:var(--font-hand);font-size:1.4rem;line-height:1.25}
.ing-list input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:20px;height:20px;margin-top:4px;border:2px solid var(--ink-soft);border-radius:6px;display:grid;place-content:center;cursor:pointer;background:var(--paper)}
.ing-list input::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--pink-strong);transform:scale(0);transition:transform .15s}
.ing-list input:checked::before{transform:scale(1)}
.ing-list input:checked+span{text-decoration:line-through;text-decoration-color:var(--pink-strong);opacity:.55}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;cursor:pointer;border-radius:14px;padding:6px;transition:background .2s,opacity .2s}
.steps li:hover{background:var(--paper-2)}
.steps li::before{content:counter(s);width:36px;height:36px;border-radius:50%;display:grid;place-content:center;font-family:var(--font-flow);font-weight:700;font-size:1.25rem;background:color-mix(in srgb,var(--accent) 35%,var(--paper));border:2px solid var(--accent)}
.steps li.done{opacity:.5}
.steps li.done::before{content:"✓";background:var(--accent)}
.steps li p{margin:5px 0 0;font-size:1.05rem}
.tip{font-size:.85rem;color:var(--ink-soft);margin:10px 0 0}
.note{margin-top:30px;background:var(--note);color:var(--note-ink);padding:18px 22px;border-radius:4px;transform:rotate(-.6deg);box-shadow:0 10px 20px -14px rgba(0,0,0,.4);font-family:var(--font-hand);font-size:1.4rem;line-height:1.3;white-space:pre-wrap}
.note b{font-family:var(--font-flow);font-size:1.5rem;display:block}
.originals{margin-top:34px}
.polaroids{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.polaroid{background:#fff;padding:8px 8px 26px;box-shadow:0 10px 22px -12px rgba(0,0,0,.45);transform:rotate(var(--r,-2deg));border:0;cursor:zoom-in;transition:transform .2s}
.polaroid:hover{transform:rotate(0) scale(1.03)}
.polaroid img{display:block;width:150px;height:190px;object-fit:cover}

/* ---------- forms / add flow ---------- */
.panel{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:clamp(18px,4vw,36px);margin-block:24px 48px}
.panel h1{font-family:var(--font-script);font-weight:400;color:var(--pink-strong);font-size:clamp(1.9rem,5vw,2.6rem);margin:0 0 4px;text-shadow:2px 2px 0 var(--hl);line-height:1.3}
.sub{color:var(--ink-soft);margin:0 0 20px;max-width:60ch}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:3px dashed var(--pink);border-radius:22px;padding:30px 18px;background:var(--paper-2);cursor:pointer;transition:background .2s,transform .2s}
.drop.over{background:color-mix(in srgb,var(--pink) 18%,var(--paper));transform:scale(1.01)}
.drop .mascot{width:120px;height:120px}
.drop strong{font-family:var(--font-flow);font-size:1.6rem}
.drop span{color:var(--ink-soft);font-size:.95rem}
.thumbs{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.thumb{position:relative;width:110px;height:140px;border-radius:12px;overflow:hidden;box-shadow:0 6px 14px -8px rgba(0,0,0,.4);background:var(--paper-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.linkish{background:none;border:0;padding:0;color:var(--pink-strong);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.engine{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;color:var(--ink-soft);background:var(--paper-2);border-radius:999px;padding:4px 12px;margin-bottom:14px}
.engine i{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block}
.reading{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 10px}
.reading .mascot{width:170px;height:170px}
.reading h2{font-family:var(--font-flow);font-size:2rem;margin:6px 0 4px}
.reading p{color:var(--ink-soft);margin:0;min-height:1.6em}
.bar{width:min(340px,100%);height:12px;border-radius:12px;background:var(--paper-2);border:2px solid var(--rule);overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,color-mix(in srgb,var(--pink) 70%,#fff) 10px 20px);transition:width .3s}
.bar.indef i{width:40%;animation:indef 1.4s ease-in-out infinite}
@keyframes indef{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field.half{grid-column:span 2}
@media (max-width:700px){.form{grid-template-columns:1fr 1fr}.field.half{grid-column:1/-1}}
.field label,.field .lbl{font-weight:700;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--rule);border-radius:14px;padding:10px 14px;background:var(--paper-2);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink)}
.field textarea{resize:vertical;min-height:160px;line-height:1.5}
#f-title{font-family:var(--font-script);font-size:1.5rem;padding:6px 14px}
.hint{font-size:.82rem;color:var(--ink-soft);margin:0}
.picker{display:flex;gap:8px;flex-wrap:wrap}
.pick{width:66px;height:66px;border-radius:16px;border:2px solid var(--rule);background:var(--paper-2);padding:4px;cursor:pointer}
.pick[aria-checked="true"]{border-color:var(--pink-strong);background:color-mix(in srgb,var(--pink) 22%,var(--paper));box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 35%,transparent)}
.pick .mascot{width:100%;height:100%}
details.raw{margin-top:6px}
details.raw summary{cursor:pointer;font-weight:700;color:var(--ink-soft)}
details.raw pre{white-space:pre-wrap;background:var(--paper-2);border-radius:12px;padding:12px;font-size:.85rem;max-height:240px;overflow:auto}
.warn{background:color-mix(in srgb,var(--butter) 45%,var(--paper));border-radius:14px;padding:10px 14px;margin:0 0 16px;font-size:.92rem}

/* ---------- modal / toast / footer ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:20px}
.modal-card{background:var(--paper);border-radius:24px;padding:26px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow)}
.modal-card .mascot{width:110px;height:110px}
.modal-card h2{font-family:var(--font-flow);font-size:1.8rem;margin:4px 0}
.modal-card p{color:var(--ink-soft);margin:0 0 18px}
.modal-card .row{justify-content:center}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-height:92vh;max-width:100%;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;z-index:70;box-shadow:var(--shadow);animation:pop .3s ease}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
.foot{padding-block:10px 40px;text-align:center;color:var(--ink-soft);font-size:.9rem}
.foot .love{font-family:var(--font-flow);font-size:1.4rem;color:var(--pink-strong)}
.foot .row{justify-content:center;margin-top:8px}
.loading{text-align:center;padding:80px 16px;color:var(--ink-soft)}
.loading .mascot{width:120px;height:120px}

/* ---------- mascots ---------- */
.mascot{display:block;overflow:visible}
.mascot .blink{animation:blink 4.4s infinite;animation-delay:var(--bd,0s);transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
.mascot .bob{animation:bob 3.2s ease-in-out infinite;animation-delay:var(--md,0s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mascot .sway{animation:sway 3s ease-in-out infinite;animation-delay:var(--md,0s);transform-box:view-box;transform-origin:60px 100px}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.mascot .curl{animation:curl 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:84px 36px}
@keyframes curl{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.mascot .flap{animation:flap .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:var(--fo,0% 50%)}
@keyframes flap{to{transform:scaleY(.72) rotate(5deg)}}
.mascot .feel{animation:feel 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
@keyframes feel{to{transform:rotate(-12deg)}}
.mascot .steam{animation:steam 2.8s ease-in-out infinite;opacity:0}
@keyframes steam{0%{transform:translateY(5px);opacity:0}35%{opacity:.85}100%{transform:translateY(-12px);opacity:0}}
.mascot .bubble{animation:bubble 3.2s ease-in infinite;opacity:0}
@keyframes bubble{0%{transform:translateY(8px);opacity:0}20%{opacity:.9}100%{transform:translateY(-24px);opacity:0}}
.mascot .twinkle{animation:twinkle 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{transform:scale(.5);opacity:.35}50%{transform:scale(1.1);opacity:1}}
.mascot .stir{animation:stir 1.2s ease-in-out infinite alternate;transform-box:view-box;transform-origin:60px 60px}
@keyframes stir{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@media (prefers-reduced-motion: reduce){
  .mascot *:not(.blink){animation:none!important}
  .card,.btn,.polaroid{transition:none}
  .card:hover .card-art .mascot{animation:none}
}

];

function guessMascot(r){
  const title = r.title || '';
  for (const [k, re] of MASCOT_KEYWORDS) if (re.test(title)) return k;
  const rest = [(r.sections||[]).flatMap(s => s.items).slice(0, 4).join(' ')].join(' ');
  for (const [k, re] of MASCOT_KEYWORDS) if (re.test(rest)) return k;
  return 'pot';

function loadImage(blob){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob); const im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    im.src = url;
  });
}
async function compress(blob, max = 1600, q = .82){
  const im = await loadImage(blob);
  const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
const blobToDataURL = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
async function smallDataURL(blob){
  for (const [m, q] of [[1000, .7], [820, .6], [660, .55]]) { const d = await blobToDataURL(await compress(blob, m, q)); if (d.length < 85000) return d; }
  return blobToDataURL(await compress(blob, 520, .5));
}

function idbOpen(){
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('no idb'));
    const r = indexedDB.open('anjes-recipes', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('recipes', { keyPath:'id' }); d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idb(db, name, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(name, mode); const req = fn(t.objectStore(name));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
async function makeLocal(){
  let db = null; let mem = clone(SEEDS);
  try { db = await idbOpen(); } catch { db = null; }
  return {
    mode:'local',
    async load(){
      if (!db) return mem;
      const all = await idb(db, 'recipes', 'readonly', s => s.getAll());
      const seeded = await idb(db, 'meta', 'readonly', s => s.get('seeded'));
      if (!seeded) {
        await idb(db, 'meta', 'readwrite', s => s.put(true, 'seeded'));
        if (!all.length) { for (const r of SEEDS) await idb(db, 'recipes', 'readwrite', s => s.put(clone(r))); return clone(SEEDS); }
      }
      return all;
    },
    async save(r){ if (db) await idb(db, 'recipes', 'readwrite', s => s.put(clone(r))); else mem = mem.filter(x => x.id !== r.id).concat([clone(r)]); },
    async remove(r){ if (db) await idb(db, 'recipes', 'readwrite', s => s.delete(r.id)); else mem = mem.filter(x => x.id !== r.id); },
    async storePhoto(blob){ return { data: await blobToDataURL(await compress(blob, 1600, .82)) }; },
    async dropPhoto(){},
  };
}
function makeCloud(db, assets){
  const col = db.collection('recipes');
  return {
    mode:'cloud',
    subscribe(next, fail){ return col.onSnapshot(snap => next(snap.docs.map(d => Object.assign({}, d.data(), { id:d.id })), snap.metadata), fail); },
    async save(r){ const body = clone(r); delete body.id; await col.doc(r.id).set(body); },
    async remove(r){ await col.doc(r.id).delete(); for (const p of r.photos || []) if (p.asset && assets) { try { await assets.delete(p.asset); } catch {} } },
    async storePhoto(blob){
      if (assets) { try { const up = await assets.upload(await compress(blob, 1800, .85), { type:'image/jpeg' }); return { asset: up.id }; } catch {} }
      return { data: await smallDataURL(blob) };
    },
    async dropPhoto(p){ if (p.asset && assets) { try { await assets.delete(p.asset); } catch {} } },
  };
}

let tessLoading = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  if (!tessLoading) tessLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = () => res(); s.onerror = () => { tessLoading = null; rej(new Error('Could not load the text reader. Check the internet connection.')); };
    document.head.appendChild(s);
  });
  return tessLoading;
}
async function prepForOCR(file){
  // Tesseract does best on the untouched photo; only enlarge small images
  const im = await loadImage(file);
  const big = Math.max(im.naturalWidth, im.naturalHeight);
  if (big >= 1600) return file;
  const k = 2000 / big;
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(im, 0, 0, c.width, c.height);
  return c;
}
async function readWithTesseract(files, onProgress){
  onProgress(0.02, 'Waking up the text reader…');
  await loadTesseract();
  const worker = await window.Tesseract.createWorker('eng', 1, {
    logger: m => { if (m.status === 'recognizing text') onProgress(null, null, m.progress); }
  });
  let text = '';
  try {
    for (let i = 0; i < files.length; i++) {
      onProgress(null, files.length > 1 ? `Reading page ${i + 1} of ${files.length}…` : 'Reading your page…');
      const canvas = await prepForOCR(files[i]);
      const { data } = await worker.recognize(canvas);
      text += data.text + '\n';
    }
  } finally { try { await worker.terminate(); } catch {} }
  const parsed = parseRecipeText(text);
  parsed.rawText = text.trim();
  return parsed;
}

/* Turns loose scanned text into title / ingredients / steps */
function parseRecipeText(raw){
  const wordy = l => {
    const toks = l.split(' ').map(t => t.replace(/^[^\w½¼¾⅓]+|[^\w½¼¾⅓]+$/g, '')).filter(Boolean);
    if (!toks.length) return false;
    const good = toks.filter(t => (/^[a-z][a-z']+$/i.test(t) && /[aeiouy]/i.test(t) && !/[A-Z].*[a-z].*[A-Z]|[a-z][A-Z]/.test(t)) || /^[aI&+]$/.test(t) || /^\d+([./]\d+)?[a-z]{0,4}$/i.test(t) || /^[½¼¾⅓]$/.test(t));
    return good.length / toks.length >= 0.72 && toks.some(t => /^[a-z]{3,}$/i.test(t) && /[aeiouy]/i.test(t));
  };
  const lines = raw.split(/\r?\n/).map(l => l.replace(/[|_~=]{2,}/g, ' ').replace(/\s+/g, ' ').trim())
    .filter(l => l.length > 2 && wordy(l));
  const BULLET = /^([-–—•*·>»+→✓□☐oO0]\s+|[-–—•*·>»→]+|\d{1,2}[.)]\s+)/;
  const VERB = /^(add|mix|cook|heat|bake|fry|grind|stir|whisk|pour|preheat|line|grease|melt|sift|fold|boil|simmer|chop|marinate|keep|coat|serve|blend|knead|roast|saut[eé]|season|combine|toss|garnish|let|place|put|remove|transfer|then|now|in|once|after|when|meanwhile|finally|first|next|do|cover|beat|cut|slice|spread|top|sprinkle|leave|set|make)\b/i;
  const VERBANY = /\b(add|mix|cook|heat|bake|fry|grind|stir|whisk|pour|preheat|grease|melt|sift|fold|boil|simmer|marinate|coat|blend|knead|roast|combine|garnish|until|minutes|mins)\b/i;
  const QTY = /(\d|½|¼|¾|⅓|\b(cups?|tbsp|tsp|spn|spoons?|gms?|grams?|kg|ml|pinch|pieces?|inch|cloves?|stick|handful)\b)/i;
  let title = '', serves = '', time = '';
  const sections = [{ name:'', items:[] }]; const steps = []; const notes = [];
  let mode = 'auto';
  for (const line of lines) {
    let l = line;
    const sv = l.match(/serves?\s*[:\-]?\s*([\d][\d\s\-–to]*)/i); if (sv) { serves = sv[1].trim(); continue; }
    const tm = l.match(/^(?:prep|cook|total|bake)?\s*time\s*[:\-]\s*(.+)$/i); if (tm) { time = tm[1].trim(); continue; }
    if (/^date\b/i.test(l)) continue;
    if (/^(ingredients?|ingr[ie]dients?)\b\W*$/i.test(l)) { mode = 'ing'; continue; }
    if (/^(instructions?|method|directions?|steps?|procedure|how to make)\b\W*$/i.test(l)) { mode = 'steps'; continue; }
    if (!title) { const t = l.replace(/^recipe\s*:?\s*/i, '').replace(/[.:]+$/, '').trim(); if (t.length >= 3) { title = t; } continue; }
    const bulleted = BULLET.test(l);
    const body = l.replace(BULLET, '').replace(/^[^\w(½¼¾⅓]+/, '').trim(); if (!body) continue;
    // "for the sauce:" style headings (with or without text after them)
    const head = body.match(/^((?:for|the)\b[^:]{2,32}):\s*(.*)$/i);
    if (head) {
      if (!head[2]) { sections.push({ name: cap(head[1]), items:[] }); if (mode === 'steps') mode = 'auto'; continue; }
      if (VERBANY.test(head[2])) { steps.push(cap(head[1]) + ': ' + head[2]); mode = 'steps'; continue; }
    }
    if (/:\s*$/.test(body) && body.length < 40 && !/\d/.test(body) && body.split(' ').length <= 5) { sections.push({ name: body.replace(/:\s*$/, ''), items:[] }); if (mode === 'steps') mode = 'auto'; continue; }
    const words = body.split(' ').length;
    const lastStep = steps[steps.length - 1];
    // a lowercase line right after a step is that step carrying on
    if (lastStep && !bulleted && /^[a-z(]/.test(body) && !/[.!]$/.test(lastStep) && mode !== 'ing') { steps[steps.length - 1] = lastStep + ' ' + body; continue; }
    const looksStep = mode === 'steps' || (mode === 'auto' && words > 4 && (VERBANY.test(body) || (VERB.test(body) && /^[A-Z]/.test(body))) && (body.length > 30 || !QTY.test(body) || (VERB.test(body) && /^[A-Z]/.test(body))));
    if (looksStep) {
      const prev = steps[steps.length - 1];
      const starts = bulleted || (VERB.test(body) && (/^[A-Z]/.test(body) || /[.!]$/.test(prev || '.')));
      if (prev && !starts) steps[steps.length - 1] = prev + ' ' + body; else steps.push(cap(body));
    } else {
      const sec = sections[sections.length - 1];
      const prevItem = sec.items[sec.items.length - 1];
      if (prevItem && !bulleted && /^[a-z(]/.test(body) && body.length < 24) sec.items[sec.items.length - 1] = prevItem + ' ' + body;
      else sec.items.push(body);
    }
  }
  const r = { title: title ? titleCase(title) : '', serves, time, sections: sections.filter(s => s.items.length || s.name), steps, notes: notes.join('\n') };
  return normalize(r);
}
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const titleCase = s => s === s.toUpperCase() || s === s.toLowerCase() ? s.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m, a, b) => a + b.toUpperCase()) : s;

function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  const arr = x => Array.isArray(x) ? x : [];
  let sections = arr(d.sections).map(s => ({ name: String(s?.name ?? '').trim(), items: arr(s?.items).map(i => String(i).trim()).filter(Boolean) })).filter(s => s.items.length || s.name);
  if (!sections.length && arr(d.ingredients).length) sections = [{ name:'', items: arr(d.ingredients).map(i => String(i).trim()).filter(Boolean) }];
  return {
    title: String(d.title ?? '').trim(), serves: String(d.serves ?? '').trim(), time: String(d.time ?? '').trim(),
    category: CATEGORIES.includes(d.category) ? d.category : '', mascot: MASCOTS[d.mascot] ? d.mascot : '',
    sections, steps: arr(d.steps).map(s => String(s).trim()).filter(Boolean), notes: String(d.notes ?? '').trim(),
  };
}

const terms = q => q.toLowerCase().split(/\s+/).filter(Boolean);

function hi(text, q){

  const hit = t.length ? pool.find(x => t.some(w => x.toLowerCase().includes(w))) : null;
  const s = hit || pool.slice(0, 3).join(' · ');
  return s.length > 90 ? s.slice(0, 88) + '…' : s;

/* =====================================================================
   Router
   ===================================================================== */
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith('recipe-')) return { name:'recipe', id: h.slice(7) };
  if (h.startsWith('edit-')) return { name:'edit', id: h.slice(5) };
  if (h === 'add') return { name:'add' };
  return { name:'home' };
}
function render(){
  if (!ready) return;
  const r = route();
  if (r.name === 'recipe') renderRecipe(r.id);
  else if (r.name === 'edit') renderEditRoute(r.id);
  else if (r.name === 'add') renderAdd();
  else renderHome();
  renderFoot();
}
window.addEventListener('hashchange', () => { closeLayer(); render(); window.scrollTo({ top:0 }); });

$('#view').addEventListener('change', e => {
  const cb = e.target.closest('input[data-ing]'); if (!cb) return;
  const r = route(); if (r.name !== 'recipe') return;
  (ticks[r.id] || (ticks[r.id] = { ing:{}, step:{} })).ing[cb.dataset.ing] = cb.checked;
});
function toggleStep(li){
  const r = route(); const t = ticks[r.id] || (ticks[r.id] = { ing:{}, step:{} });
  const i = li.dataset.step; t.step[i] = !t.step[i];
  li.classList.toggle('done', t.step[i]); li.setAttribute('aria-pressed', t.step[i]);
}
$('#view').addEventListener('keydown', e => {
  const li = e.target.closest('li[data-step]');
  if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleStep(li); }
});

/* main click handling for the view */
$('#view').addEventListener('click', async e => {
  const chip = e.target.closest('[data-filter]');
  if (chip) { filter = chip.dataset.filter; renderHome(); return; }
  const li = e.target.closest('li[data-step]'); if (li) { toggleStep(li); return; }
  const ph = e.target.closest('[data-photo]');
  if (ph) { const r = find(route().id); if (r) openLightbox(photoSrc(r.photos[+ph.dataset.photo])); return; }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'fav') {
    const r = find(route().id); if (!r) return;
    const next = Object.assign(clone(r), { fav: !r.fav });
    try { await saveRecipe(next); toast(next.fav ? 'Added to favourites ♥' : 'Removed from favourites'); } catch (err) { toast(saveError(err)); }
  } else if (a === 'delete') {
    const r = find(route().id); if (r) confirmDelete(r);
  } else onFormAction(a, act, e);
});

async function saveRecipe(r){
  r.updatedAt = Date.now();
  await backend.save(r);
  const i = recipes.findIndex(x => x.id === r.id);
  if (i >= 0) recipes[i] = r; else recipes.push(r);
  render();
}
function saveError(err){
  const c = err && err.code;
  if (c === 'quota_exceeded') return 'The recipe box is full. Delete an old recipe and try again.';
  if (c === 'invalid_argument') return 'You can view this book but not change it. Ask for edit access.';
  return 'Could not save that. Check the connection and try again.';
}

/* ---------- delete ---------- */
function confirmDelete(r){
  openLayer(`<div class="modal" data-close role="dialog" aria-modal="true" aria-labelledby="del-h"><div class="modal-card" style="${styleVars(r)}">
    ${mascotSVG(r.mascot)}

    <p>This removes the recipe and its photos from the book for good.</p>
    <div class="row"><button class="btn btn-soft" type="button" data-close>Keep it</button>
    <button class="btn btn-danger solid" type="button" id="del-yes">Delete recipe</button></div></div></div>`);
  $('#del-yes').focus();
  $('#del-yes').addEventListener('click', async () => {
    $('#del-yes').disabled = true;
    try {
      await backend.remove(r);
      recipes = recipes.filter(x => x.id !== r.id);

   Add / edit flow
   ===================================================================== */
const engineName = () => sampleFn && sampleImages ? 'Claude reads the handwriting' : 'Free text reader (best on neat or typed pages)';

function renderAdd(){
  if (!draft || draft.kind !== 'add') draft = { kind:'add', stage:'pick', files:[], urls:[] };
  if (draft.stage === 'pick') return renderPick();
  if (draft.stage === 'reading') return renderReading();
  return renderForm();
}
function renderPick(){
  $('#view').innerHTML = `
    <section class="panel">
      <h1>Add a recipe</h1>
      <p class="sub">Snap or upload the recipe page. If one recipe runs over a few pages, add them all and they'll be read together.</p>
      <span class="engine"><i></i>${esc(engineName())}</span>
      <label class="drop" id="drop" for="file-in">
        ${mascotSVG('cupcake')}
        <strong>Drop photos here</strong>
        <span>or tap to choose · JPG, PNG or screenshots</span>
      </label>
      <input id="file-in" type="file" accept="image/*" multiple hidden>
      <div class="thumbs">${draft.urls.map((u, i) => `<div class="thumb"><img src="${u}" alt="Page ${i + 1}"><button type="button" data-act="unpick" data-i="${i}" aria-label="Remove page ${i + 1}">×</button></div>`).join('')}</div>
      <div class="row">
        <button class="btn btn-primary" type="button" data-act="read" ${draft.files.length ? '' : 'disabled'}>✨ Read my recipe</button>
        <button class="linkish" type="button" data-act="manual">or type it in yourself</button>
      </div>
    </section>`;
  const drop = $('#drop'), inp = $('#file-in');
  inp.addEventListener('change', () => { addFiles(inp.files); inp.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
}
function addFiles(list){
  for (const f of list) if (f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)) { draft.files.push(f); draft.urls.push(URL.createObjectURL(f)); }
  renderPick();
}
document.addEventListener('paste', e => {
  if (route().name !== 'add' || !draft || draft.stage !== 'pick') return;
  const files = [...(e.clipboardData?.files || [])]; if (files.length) addFiles(files);
});

const cuteLines = ['Reading your handwriting…', 'Measuring the garlic from the heart…', 'Counting the cashews…', 'Spotting the quantities…', 'Sorting ingredients from steps…', 'Almost plated up…'];
function renderReading(){
  $('#view').innerHTML = `<section class="panel"><div class="reading">
    ${mascotSVG('pot')}
    <h2>Cooking up your page</h2>
    <p id="read-msg">${cuteLines[0]}</p>
    <div class="bar ${sampleFn && sampleImages ? 'indef' : ''}" id="read-bar"><i></i></div>
    <div class="row"><button class="btn btn-soft" type="button" data-act="cancel-read">Cancel</button></div>
  </div></section>`;
}
async function startReading(){
  draft.stage = 'reading'; renderReading();
  const ctl = readCtl = { cancelled:false };
  let li = 0; const spin = setInterval(() => { const m = $('#read-msg'); if (m && sampleFn && sampleImages) m.textContent = cuteLines[++li % cuteLines.length]; }, 2600);
  let result = null, error = null;
  try {
    if (sampleFn && sampleImages) result = await readWithClaude(draft.files);
    else result = await readWithTesseract(draft.files, (frac, msg, prog) => {
      const bar = $('#read-bar i'), m = $('#read-msg');
      if (msg && m) m.textContent = msg;
      if (bar && prog != null) bar.style.width = Math.round(10 + prog * 90) + '%';
      else if (bar && frac != null) bar.style.width = Math.round(frac * 100) + '%';
    });
  } catch (err) { error = err; }
  clearInterval(spin);
  if (ctl.cancelled || route().name !== 'add') return;
  const base = result || normalize({});
  if (!base.mascot) base.mascot = guessMascot(base);
  if (!base.category) base.category = guessCategory(base.mascot);
  draft.stage = 'form';
  draft.recipe = Object.assign({ id: uid(), fav:false, photos:[], createdAt: Date.now() }, base);
  draft.rawText = result?.rawText || '';
  draft.warn = error ? readError(error) : (!base.title && !base.sections.length && !base.steps.length ? 'Couldn\'t make out any text on that photo. Type the recipe in below; the photo will still be saved with it.' : (!(sampleFn && sampleImages) ? 'Here\'s what the text reader found. Handwriting can come out a little jumbled, so give it a quick check and fix anything before saving.' : ''));
  renderForm();
}
function readError(e){
  const c = e && e.code;
  if (c === 'not_granted') { sampleFn = null; return 'Claude wasn\'t allowed to read the photo. Type the recipe in below; the photo will still be saved.'; }
  if (c === 'rate_limited') return 'Claude is busy right now. Type it in below, or try again in a little while.';
  if (c === 'image_rejected') return 'That photo couldn\'t be opened. Try a JPG or PNG screenshot instead.';
  if (e && e.message === 'image') return 'That photo format couldn\'t be opened in this browser. Try a JPG or PNG (on iPhone: screenshot the photo).';
  return (e && e.message && !c ? e.message + ' ' : '') + 'You can type the recipe in below; the photo will still be saved.';
}

function renderEditRoute(id){
  const r = find(id);
  if (!r) { location.hash = ''; return; }
  if (!draft || draft.kind !== 'edit' || draft.recipe.id !== id) draft = { kind:'edit', stage:'form', recipe: clone(r), files:[], urls:[], removed:[] };
  renderForm();
}
function renderForm(){

  $('#view').innerHTML = `
    <section class="panel" style="${styleVars(r)}">

      <form class="form" id="recipe-form" novalidate>

        <div class="field full"><span class="lbl" id="pick-l">Mascot</span>
          <div class="picker" role="radiogroup" aria-labelledby="pick-l">${Object.entries(MASCOTS).map(([k, m]) => `<button type="button" class="pick" role="radio" aria-checked="${k === r.mascot}" data-mascot="${k}" title="${esc(m.label)}" aria-label="${esc(m.label)}">${mascotSVG(k)}</button>`).join('')}</div></div>
        <div class="field half"><label for="f-ing">Ingredients</label>
          <textarea id="f-ing" rows="12" placeholder="Sauce:&#10;Mayonnaise – 1 cup&#10;Sriracha – 4 tbsp">${esc(sectionsToText(r.sections || []))}</textarea>
          <p class="hint">One per line. A line ending in “:” starts a group, like “Sauce:”.</p></div>
        <div class="field half"><label for="f-steps">Method</label>
          <textarea id="f-steps" rows="12" placeholder="Mix everything and keep it aside for 1 hour.">${esc((r.steps || []).join('\n'))}</textarea>
          <p class="hint">One step per line.</p></div>
        <div class="field full"><label for="f-notes">Notes</label><textarea id="f-notes" rows="3" style="min-height:90px" placeholder="Tips, swaps, who loved it…">${esc(r.notes)}</textarea></div>
        <div class="field full"><span class="lbl">Photos of the page</span>
          <div class="thumbs" style="margin-top:0">
            ${keepPhotos.map((p, i) => `<div class="thumb"><img src="${esc(photoSrc(p))}" alt="Saved page ${i + 1}"><button type="button" data-act="drop-saved" data-i="${i}" aria-label="Remove photo">×</button></div>`).join('')}
            ${draft.urls.map((u, i) => `<div class="thumb"><img src="${u}" alt="New page ${i + 1}"><button type="button" data-act="drop-new" data-i="${i}" aria-label="Remove photo">×</button></div>`).join('')}
            <label class="thumb drop" for="more-in" style="padding:6px;border-width:2px" title="Add photo"><strong style="font-size:2rem">+</strong><span>photo</span></label>
          </div>
          <input id="more-in" type="file" accept="image/*" multiple hidden>
        </div>
        ${draft.rawText ? `<details class="raw field full"><summary>What the text reader saw</summary><pre>${esc(draft.rawText)}</pre></details>` : ''}
        <div class="row field full">
          <button class="btn btn-primary" type="submit" id="save-btn">${editing ? 'Save changes' : 'Save to my book'}</button>
          <button class="btn btn-soft" type="button" data-act="cancel-form">Cancel</button>
        </div>
      </form>

  $('#more-in').addEventListener('change', e => { syncForm(); for (const f of e.target.files) { draft.files.push(f); draft.urls.push(URL.createObjectURL(f)); } renderForm(); });
  $('#recipe-form').addEventListener('submit', e => { e.preventDefault(); submitForm(); });
  $('#recipe-form').addEventListener('click', e => {
    const p = e.target.closest('[data-mascot]'); if (!p) return;
    draft.recipe.mascot = p.dataset.mascot;

function syncForm(){
  if (!$('#recipe-form')) return;
  const r = draft.recipe;
  r.title = $('#f-title').value.trim(); r.serves = $('#f-serves').value.trim(); r.time = $('#f-time').value.trim();
  r.category = $('#f-cat').value; r.notes = $('#f-notes').value.trim();
  r.sections = textToSections($('#f-ing').value); r.steps = textToSteps($('#f-steps').value);
}
async function submitForm(){
  syncForm();
  const r = draft.recipe;
  if (!r.title) { $('#f-title').focus(); toast('Give the recipe a name first'); return; }
  const btn = $('#save-btn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const photos = (r.photos || []).slice();
    for (const f of draft.files) { try { photos.push(await backend.storePhoto(f)); } catch {} }
    r.photos = photos;
    await saveRecipe(clone(r));
    for (const p of draft.removed || []) await backend.dropPhoto(p);
    draft.urls.forEach(u => URL.revokeObjectURL(u));
    const id = r.id; draft = null;
    toast('Saved to the book ♡');
    location.hash = 'recipe-' + id;
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Try saving again'; toast(saveError(err));
  }
}
function onFormAction(a, el){
  if (a === 'unpick') { const i = +el.dataset.i; URL.revokeObjectURL(draft.urls[i]); draft.files.splice(i, 1); draft.urls.splice(i, 1); renderPick(); }
  else if (a === 'read') { if (draft.files.length) startReading(); }
  else if (a === 'manual') {
    const base = normalize({}); base.mascot = 'pot'; base.category = 'Mains';
    draft.stage = 'form'; draft.warn = ''; draft.rawText = '';
    draft.recipe = Object.assign({ id: uid(), fav:false, photos:[], createdAt: Date.now() }, base);
    renderForm();
  }
  else if (a === 'cancel-read') { if (readCtl) readCtl.cancelled = true; draft.stage = 'pick'; renderPick(); }
  else if (a === 'drop-saved') { syncForm(); const [p] = draft.recipe.photos.splice(+el.dataset.i, 1); (draft.removed || (draft.removed = [])).push(p); renderForm(); }
  else if (a === 'drop-new') { syncForm(); const i = +el.dataset.i; URL.revokeObjectURL(draft.urls[i]); draft.files.splice(i, 1); draft.urls.splice(i, 1); renderForm(); }
  else if (a === 'cancel-form') {
    const wasEdit = draft.kind === 'edit' ? draft.recipe.id : null;
    draft?.urls?.forEach(u => URL.revokeObjectURL(u)); draft = null;
    location.hash = wasEdit ? 'recipe-' + wasEdit : '';
  }
}

/* =====================================================================
   Footer (with backup for the browser-only version)
   ===================================================================== */
function renderFoot(){
  const local = backend.mode === 'local';
  $('#foot').innerHTML = `<div class="love">made with love for Anje ♡</div>
    <div>${local ? 'Recipes are saved in this browser on this device.' : 'Recipes are saved to this page, so they show up on any device.'}</div>
    ${local && !window.claude ? `<div class="row"><button class="btn btn-soft" type="button" id="bk-out">Back up recipes</button>
      <label class="btn btn-soft" for="bk-in">Restore a backup</label><input id="bk-in" type="file" accept="application/json,.json" hidden></div>` : ''}`;
  $('#bk-out')?.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ app:'anjes-recipes', version:1, recipes }, null, 1)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'anjes-recipes-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  $('#bk-in')?.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text()); const list = Array.isArray(data) ? data : data.recipes;
      if (!Array.isArray(list)) throw new Error('bad');
      let n = 0;
      for (const raw of list) { if (!raw || !raw.id) continue; const r = Object.assign({ photos:[], fav:false, createdAt: Date.now() }, raw, normalize(raw)); r.mascot = r.mascot || guessMascot(r); await backend.save(r); n++; }
      recipes = await backend.load(); render(); toast(`Restored ${n} recipe${n === 1 ? '' : 's'}`);
    } catch { toast('That file isn\'t a recipe backup'); }
  });
}

/* =====================================================================
   Boot: Claude page if available, otherwise this browser
   ===================================================================== */
async function boot(){
  let db = null, assets = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      [db, assets, sampleFn] = await Promise.all(['db', 'assets', 'sample'].map(n => window.claude.use(n).catch(() => null)));
      if (sampleFn) { const lim = await sampleFn.limits().catch(() => null); sampleImages = lim?.images?.maxCount || 0; }
    } catch {}
  }
  if (db) {
    backend = makeCloud(db, assets);
    let first = true;
    const slow = setTimeout(() => { if (first) { ready = true; recipes = []; render(); toast('Still connecting to the recipe box…'); } }, 10000);
    backend.subscribe((list) => {
      recipes = list.map(r => Object.assign({ sections:[], steps:[], photos:[] }, r));
      if (first) { first = false; clearTimeout(slow); }
      ready = true;
      // don't yank the page out from under an open form
      const rt = route().name; if (rt === 'add' || rt === 'edit') { renderFoot(); return; }
      render(); renderResults();
    }, () => { clearTimeout(slow); ready = true; render(); toast('Lost connection to the recipe box. Reload to try again.'); });
  } else {
    backend = await makeLocal();
    recipes = await backend.load().catch(() => clone(SEEDS));
    ready = true; render();
  }
}
boot();
})();
</script>
